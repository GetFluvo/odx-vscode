name: release

# A published GitHub release puts the extension on Open VSX and the Visual
# Studio Marketplace; a version already there is skipped.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: marketplaces
      url: https://open-vsx.org/extension/getfluvo/odx
    permissions:
      contents: read
      # Open VSX trusted publishing exchanges the OIDC token for a short-lived one.
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: The release tag names package.json's version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - name: Build and test the .vsix
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test
          npx vsce package --no-dependencies -o odx.vsix
      - name: Publish to Open VSX
        # Trusted publishing, unless an OVSX_PAT secret holds an access token:
        # Open VSX does not offer trusted publishers for every namespace yet.
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish --packagePath odx.vsix --skip-duplicate
          else
            npx ovsx publish --packagePath odx.vsix --skip-duplicate --trusted-publishing
          fi
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::No VSCE_PAT secret: not publishing to the Visual Studio Marketplace"
            exit 0
          fi
          npx vsce publish --packagePath odx.vsix --skip-duplicate
